name: GT RPG static checks and package

on:
  push:
    paths:
      - "projects/gt-rpg/**"
      - ".github/workflows/gt-rpg-test-build.yml"
  pull_request:
    paths:
      - "projects/gt-rpg/**"
      - ".github/workflows/gt-rpg-test-build.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/gt-rpg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests
      - run: npm test
      - run: npm run check:syntax
      - run: python tools/build_addon.py
